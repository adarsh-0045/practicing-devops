name: System Report

on:
  push:

jobs:
  system-info:
    runs-on: ubuntu-latest

    steps:
      - name: Print OS and kernel
        run: uname -a

      - name: Check disk space
        run: df -h

      - name: Print date and time
        run: date

      - name: Install tree
        run: |
          sudo apt-get update
          sudo apt-get install -y tree

      - name: Show home directory
        run: tree -L 2 ~

  tool-check:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Create report
        run: |
          cat > report.json <<'EOF'
          {
            "name": "GitHub Actions",
            "version": "1.0",
            "status": "success"
          }
          EOF

      - name: Read report using jq
        run: jq '.name' report.json

      - name: Print tool versions
        run: |
          python3 --version
          git --version
          jq --version

      - name: Complete report
        run: echo "Report complete"